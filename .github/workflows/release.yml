name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # arm64 only: two macOS jobs used to upload colliding latest-mac.yml files
    # (the x64 one won), so arm64 users were served the x64 update. Extend the
    # matrix only when multi-arch metadata can be published without collision.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            script: dist:mac:arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Point the baked-in update feed at this repository so electron-updater
      # checks this repo's releases after the fork.
      - name: Build with update feed
        run: npm run ${{ matrix.script }} -- -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run smoke:packaged
      - name: Verify traffic-light inset
        run: |
          pkill -f "DeepSeek Harness" 2>/dev/null || true
          APP="$PWD/dist/mac-arm64/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness"
          "$APP" --remote-debugging-port=9333 > /tmp/dsh-inset.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9333/json 2>/dev/null | grep -q '"url": "http://127.0.0.1:'; then
              break
            fi
            sleep 1
          done
          npm run verify:inset
          STATUS=$?
          if [ $STATUS -ne 0 ]; then cat /tmp/dsh-inset.log; fi
          exit $STATUS
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prepare:windows
      - run: npm test
      - run: npm run test:win-console
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run smoke:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*windows*.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:linux
      - run: npm run smoke:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - macos
      - windows
      - linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          generate_release_notes: true
