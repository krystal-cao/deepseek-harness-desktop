name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # Both arches are built in ONE electron-builder invocation so a single
    # latest-mac.yml carries the arm64 and x64 zips; electron-updater selects
    # the right one by arch in the filename (Provider.js matches process.arch).
    runs-on: macos-latest
    steps:
      # Full history so annotated tag objects are available: the release
      # notes are authored in the tag message at tag time and read back here.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Point the baked-in update feed at this repository so electron-updater
      # checks this repo's releases after the fork.
      - name: Build with update feed
        run: npm run dist:mac:all -- -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run smoke:packaged
      - name: Verify traffic-light inset
        run: |
          pkill -f "DSH" 2>/dev/null || true
          APP="$PWD/dist/mac-arm64/DSH.app/Contents/MacOS/DSH"
          "$APP" --remote-debugging-port=9333 > /tmp/dsh-inset.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9333/json 2>/dev/null | grep -q '"url": "http://127.0.0.1:'; then
              break
            fi
            sleep 1
          done
          npm run verify:inset
          STATUS=$?
          if [ $STATUS -ne 0 ]; then cat /tmp/dsh-inset.log; fi
          exit $STATUS
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes are maintained when the tag is created: annotated
          # tag messages become the GitHub release body. Read them from the
          # server via the git-data API: checkout may materialize the tag as
          # a lightweight ref pointing at the commit, in which case
          # `git tag -l --format='%(contents)'` would yield the commit message
          # instead of the release notes. Lightweight tags (empty notes) fall
          # back to commit-derived notes.
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          REF_JSON="$(gh api "/repos/${{ github.repository }}/git/refs/tags/$GITHUB_REF_NAME")"
          OBJ_SHA="$(printf '%s' "$REF_JSON" | jq -r '.object.sha')"
          OBJ_TYPE="$(printf '%s' "$REF_JSON" | jq -r '.object.type')"
          if [ "$OBJ_TYPE" = "tag" ]; then
            gh api "/repos/${{ github.repository }}/git/tags/$OBJ_SHA" --jq '.message' > "$NOTES_FILE"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/*.yml --clobber
            if [ -s "$NOTES_FILE" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
            fi
          elif [ -s "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/*.yml --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/*.yml --generate-notes
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false
